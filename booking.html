
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Event | Hujan Project</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .booking-page {
            min-height: 100vh;
            background: #EAF6FD;
            padding: 50px 20px;
        }

        .booking-box {
            max-width: 760px;
            margin: auto;
            padding: 40px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 15px 45px #101f3c15;
        }

        .booking-box h1 {
            color: #101F3C;
            margin: 15px 0;
        }

        .booking-box > p {
            color: #718096;
            line-height: 1.7;
            font-size: 14px;
        }

        .booking-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-top: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 13px;
            font-weight: bold;
            color: #101F3C;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 13px;
            border: 1px solid #DCE5EF;
            border-radius: 6px;
            font: inherit;
            font-size: 13px;
            width: 100%;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: 2px solid #BDE7FC;
            border-color: #65B9EB;
        }

        #bookingMessage {
            margin-top: 18px;
            font-size: 13px;
        }

        .submit-booking {
            margin-top: 25px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        @media(max-width:600px) {
            .booking-box {
                padding: 25px 18px;
            }

            .booking-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }
        }
    </style>
</head>
<body>

<div class="booking-page">

    <div class="booking-box">

        <a href="index.html" style="color:#65B9EB;font-size:13px">
            ← Kembali ke Home
        </a>

        <br><br>

        <span class="tagline">HUJAN PROJECT BOOKING</span>

        <h1>Let's Plan Your Event!</h1>

        <p>
            Isi formulir berikut untuk mengajukan pemesanan
            layanan Hujan Project. Tim kami akan menghubungi
            Anda untuk konfirmasi lebih lanjut.
        </p>

        <form id="bookingForm">

            <div class="booking-grid">

                <div class="form-group">
                    <label>Nama Lengkap *</label>
                    <input type="text" name="name"
                        maxlength="100" required>
                </div>

                <div class="form-group">
                    <label>Nama Perusahaan</label>
                    <input type="text" name="company"
                        maxlength="120">
                </div>

                <div class="form-group">
                    <label>Nomor WhatsApp *</label>
                    <input type="tel" name="phone"
                        maxlength="25" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email"
                        maxlength="120">
                </div>

                <div class="form-group">
                    <label>Jenis Event *</label>
                    <select name="eventType" required>
                        <option value="">Pilih event</option>
                        <option>Corporate Event</option>
                        <option>Seminar / Workshop</option>
                        <option>Concert / Festival</option>
                        <option>Wedding</option>
                        <option>Community Event</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Tanggal Acara *</label>
                    <input type="date" name="eventDate" required>
                </div>

                <div class="form-group">
                    <label>Lokasi Acara</label>
                    <input type="text" name="location"
                        maxlength="180">
                </div>

                <div class="form-group">
                    <label>Estimasi Peserta</label>
                    <select name="participants">
                        <option value="">Pilih jumlah</option>
                        <option>Di bawah 50 orang</option>
                        <option>50 - 100 orang</option>
                        <option>101 - 300 orang</option>
                        <option>301 - 500 orang</option>
                        <option>Lebih dari 500 orang</option>
                    </select>
                </div>

                <div class="form-group full">
                    <label>Layanan yang Dibutuhkan *</label>
                    <select name="service" required>
                        <option value="">Pilih layanan</option>
                        <option>Event Organizer</option>
                        <option>Event Production</option>
                        <option>Photo & Video Documentation</option>
                        <option>Live Streaming</option>
                        <option>Stage Management</option>
                        <option>Multiple Services</option>
                    </select>
                </div>

                <div class="form-group full">
                    <label>Estimasi Budget</label>
                    <select name="budget">
                        <option value="">Pilih budget</option>
                        <option>Di bawah Rp5 juta</option>
                        <option>Rp5 - 10 juta</option>
                        <option>Rp10 - 25 juta</option>
                        <option>Rp25 - 50 juta</option>
                        <option>Di atas Rp50 juta</option>
                        <option>Diskusi terlebih dahulu</option>
                    </select>
                </div>

                <div class="form-group full">
                    <label>Detail Kebutuhan Event *</label>
                    <textarea name="details"
                        maxlength="2000"
                        placeholder="Ceritakan konsep dan kebutuhan acara..."
                        required></textarea>
                </div>

            </div>

            <button type="submit"
                class="btn-primary submit-booking"
                id="submitBooking">
                Kirim Booking →
            </button>

            <div id="bookingMessage"></div>

        </form>

    </div>

</div>

<script type="module" src="booking.js"></script>

</body>
</html>
